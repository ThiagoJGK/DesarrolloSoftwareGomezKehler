<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Outer Compass Ring -->
  <circle cx="225" cy="225" r="180" fill="none" stroke="#38bdf8" stroke-width="8"/>
  <!-- Inner Ring -->
  <circle cx="225" cy="225" r="150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.55"/>
  
  <!-- Cardinal Ticks -->
  <line x1="225" y1="30" x2="225" y2="60" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="225" y1="390" x2="225" y2="420" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="225" x2="60" y2="225" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="390" y1="225" x2="420" y2="225" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Ordinal Ticks -->
  <line x1="87" y1="87" x2="108" y2="108" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="363" y1="87" x2="342" y2="108" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="87" y1="363" x2="108" y2="342" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="363" y1="363" x2="342" y2="342" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Globe Lines -->
  <ellipse cx="225" cy="225" rx="65" ry="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="85" y1="225" x2="365" y2="225" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Secondary Star Points -->
  <polygon points="225,225 315,135 225,200" fill="#94a3b8" fill-opacity="0.7"/>
  <polygon points="225,225 315,315 250,225" fill="#94a3b8" fill-opacity="0.7"/>
  <polygon points="225,225 135,315 225,250" fill="#94a3b8" fill-opacity="0.7"/>
  <polygon points="225,225 135,135 200,225" fill="#94a3b8" fill-opacity="0.7"/>

  <!-- Primary Compass Needles -->
  <!-- North -->
  <polygon points="225,225 225,85 195,225" fill="#ffffff"/>
  <polygon points="225,225 225,85 255,225" fill="#38bdf8"/>
  <!-- South -->
  <polygon points="225,225 225,365 195,225" fill="#ffffff"/>
  <polygon points="225,225 225,365 255,225" fill="#0284c7"/>
  <!-- East -->
  <polygon points="225,225 365,225 225,195" fill="#38bdf8"/>
  <polygon points="225,225 365,225 225,255" fill="#0284c7"/>
  <!-- West -->
  <polygon points="225,225 85,225 225,195" fill="#ffffff"/>
  <polygon points="225,225 85,225 225,255" fill="#94a3b8"/>

  <!-- Center Pivot -->
  <circle cx="225" cy="225" r="16" fill="#ffffff"/>
  <circle cx="225" cy="225" r="8" fill="#38bdf8"/>
</svg>