name: CI - Build & Tests

on:
  push:
    branches: [ dev, prod ]
  pull_request:
    branches: [ dev, prod ]

jobs:
  backend:
    name: Backend (.NET 8 Restore, Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies (using aspnet-core/NuGet.Config)
        run: dotnet restore aspnet-core/TourismTracking.sln

      - name: Build solution (Release)
        run: dotnet build aspnet-core/TourismTracking.sln --configuration Release --no-restore

      - name: Run unit & integration tests
        run: dotnet test aspnet-core/TourismTracking.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Angular 18 Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: angular/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build
